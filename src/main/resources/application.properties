
# =========================
# SERVER
# =========================
server.port=8080


# =========================
# KAFKA
# =========================
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=fraud-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.properties.spring.json.trusted.packages=*

# Ajustado para bater exatamente com o seu package e nome da classe
spring.kafka.consumer.properties.spring.json.value.default.type=com.rePlikant.fraud_detection.dto.TransactionDTO


# =========================
# POSTGRES
# =========================
spring.datasource.url=jdbc:postgresql://postgres:5432/frauddb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================
# LOGS (opcional mas útil)
# =========================
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=INFO